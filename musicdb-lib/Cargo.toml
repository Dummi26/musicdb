[package]
name = "musicdb-lib"
version = "0.1.0"
edition = "2024"

[dependencies]
base64 = "0.23.0"
colorize = "0.1.0"
playback-rs = { version = "0.4.8", optional = true }
rand = "0.10.2"
rc-u8-reader = "2.0.17"
rodio = { version = "0.22.2", optional = true }
sysinfo = "0.39.6"

[features]
default = []
playback = []
default-playback = ["playback-via-playback-rs"]
# default-playback = ["playback-via-rodio"]
playback-via-sleep = ["playback"]
playback-via-mpv = ["playback"]
playback-via-playback-rs = ["playback", "dep:playback-rs"]
playback-via-rodio = ["playback", "dep:rodio"]
